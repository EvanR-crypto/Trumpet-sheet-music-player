<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trumpet Sheet Music Reader & Player</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #d97706;
      --text: #f8fafc;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 {
      margin-top: 0;
      color: var(--accent);
      font-size: 1.5rem;
      text-align: center;
    }
    .viewport {
      width: 100%;
      height: 300px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    button, input[type="file"]::file-selector-button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .full-width {
      grid-column: span 2;
    }
    .status {
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .setting-group {
      margin: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎺 Trumpet OMR Player</h1>

  <div class="viewport">
    <video id="webcam" autoplay playsinline></video>
    <img id="preview" style="display:none;" alt="Captured Sheet Music">
  </div>

  <div class="setting-group">
    <label for="pitchSelect">Playback Pitch:</label>
    <select id="pitchSelect" style="padding: 6px; border-radius: 4px;">
      <option value="concert">Concert Pitch (Actual Sounding)</option>
      <option value="written" selected>Written Pitch (Bb Trumpet)</option>
    </select>
  </div>

  <div class="controls">
    <button id="snapBtn">Capture Photo</button>
    <input type="file" id="fileInput" accept="image/*">
    <button id="processBtn" class="full-width" disabled>Process Sheet Music</button>
    <button id="playBtn" class="full-width" disabled>Play Transposition</button>
  </div>

  <div class="status" id="statusBox">
    Camera ready. Take a snap or upload a sheet music image.
  </div>
</div>

<script>
  const video = document.getElementById('webcam');
  const preview = document.getElementById('preview');
  const snapBtn = document.getElementById('snapBtn');
  const fileInput = document.getElementById('fileInput');
  const processBtn = document.getElementById('processBtn');
  const playBtn = document.getElementById('playBtn');
  const statusBox = document.getElementById('statusBox');
  const pitchSelect = document.getElementById('pitchSelect');

  let currentImageBlob = null;
  let parsedNotes = [];
  let audioCtx = null;

  // 1. Initialize WebRTC Camera Access
  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }
      });
      video.srcObject = stream;
    } catch (err) {
      statusBox.textContent = "Camera access denied or unavailable. Use file upload.";
    }
  }
  initCamera();

  // Capture image frame from canvas
  snapBtn.addEventListener('click', () => {
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    canvas.toBlob(blob => {
      currentImageBlob = blob;
      preview.src = URL.createObjectURL(blob);
      video.style.display = 'none';
      preview.style.display = 'block';
      processBtn.disabled = false;
      statusBox.textContent = "Photo captured. Click 'Process Sheet Music'.";
    }, 'image/jpeg');
  });

  // Handle file input
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      currentImageBlob = e.target.files[0];
      preview.src = URL.createObjectURL(currentImageBlob);
      video.style.display = 'none';
      preview.style.display = 'block';
      processBtn.disabled = false;
      statusBox.textContent = "File loaded. Click 'Process Sheet Music'.";
    }
  });

  // 2. Optical Music Recognition (OMR) API Hook
  processBtn.addEventListener('click', async () => {
    statusBox.textContent = "Analyzing sheet music with OMR engine...";
    processBtn.disabled = true;

    try {
      // Send currentImageBlob to your backend or cloud OMR endpoint
      // Example endpoint payload:
      /*
      const formData = new FormData();
      formData.append('file', currentImageBlob);
      const res = await fetch('/api/omr-process', { method: 'POST', body: formData });
      const data = await res.json();
      parsedNotes = data.notes;
      */

      // Mock parsed notes output (Note pitch in Hz, Duration in seconds)
      // Representing written notes: C4, D4, E4, F4, G4, A4, B4, C5
      parsedNotes = [
        { name: "C4", writtenFreq: 261.63, duration: 0.5 },
        { name: "D4", writtenFreq: 293.66, duration: 0.5 },
        { name: "E4", writtenFreq: 329.63, duration: 0.5 },
        { name: "F4", writtenFreq: 349.23, duration: 0.5 },
        { name: "G4", writtenFreq: 392.00, duration: 0.5 },
        { name: "A4", writtenFreq: 440.00, duration: 0.5 },
        { name: "B4", writtenFreq: 493.88, duration: 0.5 },
        { name: "C5", writtenFreq: 523.25, duration: 1.0 }
      ];

      statusBox.textContent = "Recognition complete! Ready for audio playback.";
      playBtn.disabled = false;
    } catch (err) {
      statusBox.textContent = "Failed to process image. Make sure lighting is clear.";
      processBtn.disabled = false;
    }
  });

  // 3. WebAudio Playback & Bb Transposition Logic
  playBtn.addEventListener('click', () => {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    const isConcert = pitchSelect.value === 'concert';
    // B-flat Trumpet sounds a major 2nd (2 semitones) lower than written pitch.
    // Transposition frequency multiplier: 2^(-2/12) ≈ 0.890898
    const Bb_TRANSPOSITION_FACTOR = Math.pow(2, -2 / 12);

    let currentTime = audioCtx.currentTime;

    parsedNotes.forEach(note => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      // Set oscillator waveform to emulate brass harmonics (sawtooth work best for basic synthesis)
      osc.type = 'sawtooth';

      let frequency = note.writtenFreq;
      if (isConcert) {
        frequency *= Bb_TRANSPOSITION_FACTOR; // Shift down 2 semitones
      }

      osc.frequency.setValueAtTime(frequency, currentTime);

      // Envelope ADSR (Attack, Decay, Sustain, Release) for realistic note articulation
      gain.gain.setValueAtTime(0, currentTime);
      gain.gain.linearRampToValueAtTime(0.3, currentTime + 0.05); // Attack
      gain.gain.exponentialRampToValueAtTime(0.001, currentTime + note.duration); // Decay

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(currentTime);
      osc.stop(currentTime + note.duration);

      currentTime += note.duration + 0.05; // Short pause between notes
    });

    statusBox.textContent = `Playing back notes (${pitchSelect.value} pitch)...`;
  });
</script>

</body>
</html>
